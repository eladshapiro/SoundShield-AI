<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>SoundShield</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cpath d='M16 6l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V9l8-3z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 16h2l1.5-4 2 8 2-6 1.5 2H21' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script>
    /* Apply saved theme + language before first paint (no flash). */
    (function () {
        try {
            var d = localStorage.getItem('ss-dark-mode');
            var dark = d === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : d === 'true';
            if (dark) document.documentElement.classList.add('dark');
            var l = localStorage.getItem('ss-lang');
            if (l === 'he' || l === 'en') {
                document.documentElement.lang = l;
                document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
            }
        } catch (e) { /* storage unavailable */ }
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="/static/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data>

    <a href="#main" class="skip-link" x-text="$t('skipToContent')">Skip to content</a>

    <!-- SVG symbol library -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.5v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V5.5L12 3z"/><path d="M8.5 12h1.5l1-3 1.5 6 1.5-4.5 1 1.5h1.5"/></symbol>
            <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
            <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h1"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.87l11-6.5a1 1 0 000-1.74l-11-6.5A1 1 0 008 5.5z"/></symbol>
            <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
            <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 6.3v11.4a1 1 0 01-1.55.83L9 12.83a1 1 0 010-1.66l8.45-5.7A1 1 0 0119 6.3z"/></symbol>
            <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 6.3v11.4a1 1 0 001.55.83l8.45-5.7a1 1 0 000-1.66L6.55 5.47A1 1 0 005 6.3z"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 16.5H2.5L12 3z"/><path d="M12 10v4M12 17.5v.5"/></symbol>
            <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></symbol>
            <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0014.5 4.5L20 16"/><path d="M20 21v-5h-5"/></symbol>
            <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
            <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></symbol>
            <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
            <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></symbol>
            <symbol id="i-ear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0112 0c0 3-2 4-2 6.5A3.5 3.5 0 0112.5 20"/><path d="M9.5 10a2.5 2.5 0 015 0c0 1.5-1.5 2-1.5 3.5"/></symbol>
            <symbol id="i-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></symbol>
            <symbol id="i-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
            <symbol id="i-bubble" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-7l-5 4v-4H6a2 2 0 01-2-2V6z"/><path d="M8 9h8M8 12h5"/></symbol>
            <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></symbol>
            <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></symbol>
        </defs>
    </svg>

    <!-- ===== Toolbar ===== -->
    <header class="toolbar">
        <div class="brand">
            <div class="brand__mark"><svg><use href="#i-shield"/></svg></div>
            <div>
                <div class="brand__name">SoundShield</div>
                <div class="brand__sub" x-text="$t('tagline')"></div>
            </div>
        </div>
        <div class="toolbar__spacer"></div>
        <div class="toolbar__status" x-show="$store.health.checked" x-cloak>
            <span class="dot" :class="{ 'is-off': !$store.health.online }"></span>
            <span x-text="$store.health.online ? $t('serverReady') : $t('serverOffline')"></span>
        </div>
        <div class="seg" role="group" :aria-label="$t('uiLanguage')">
            <button class="seg__btn" :class="{ 'is-on': $store.ui.lang === 'he' }" @click="$store.ui.setLang('he')" lang="he">עברית</button>
            <button class="seg__btn" :class="{ 'is-on': $store.ui.lang === 'en' }" @click="$store.ui.setLang('en')" lang="en">English</button>
        </div>
        <button class="icon-btn" @click="$store.ui.toggleDark()" :aria-label="$t('appearance')" :title="$t('appearance')">
            <svg x-show="!$store.ui.dark"><use href="#i-moon"/></svg>
            <svg x-show="$store.ui.dark" x-cloak><use href="#i-sun"/></svg>
        </button>
        <a class="icon-btn" href="/admin" :aria-label="$t('admin')" :title="$t('admin')"><svg><use href="#i-gear"/></svg></a>
    </header>

    <div class="layout">

        <!-- ===== Sidebar ===== -->
        <aside class="sidebar">
            <section>
                <div class="section-title"><span x-text="$t('newAnalysis')"></span></div>
                <div class="card">
                    <div class="card__bd" style="display:flex; flex-direction:column; gap:12px">
                        <div class="dropzone"
                             :class="{ 'is-over': $store.upload.isOver, 'is-reject': !!$store.upload.error }"
                             role="button" tabindex="0"
                             :aria-label="$t('dropTitle')"
                             @click="$refs.fileInput.click()"
                             @keydown.enter.prevent="$refs.fileInput.click()"
                             @keydown.space.prevent="$refs.fileInput.click()"
                             @dragover.prevent="$store.upload.isOver = true"
                             @dragleave.prevent="$store.upload.isOver = false"
                             @drop.prevent="$store.upload.drop($event)">
                            <input type="file" x-ref="fileInput" class="sr-only" tabindex="-1"
                                   accept=".wav,.mp3,.m4a,.flac,.aac,.ogg,audio/*"
                                   @change="$store.upload.pick($event.target.files[0]); $event.target.value = ''">
                            <div class="dropzone__icon"><svg><use href="#i-upload"/></svg></div>
                            <div class="dropzone__title" x-text="$t('dropTitle')"></div>
                            <div class="dropzone__sub" x-text="$t('dropSubShort')"></div>
                        </div>

                        <template x-if="$store.upload.file">
                            <div class="file-pill">
                                <div class="file-pill__icon"><svg><use href="#i-wave"/></svg></div>
                                <div style="min-width:0; flex:1">
                                    <div class="file-pill__name" x-text="$store.upload.file.name" dir="auto"></div>
                                    <div class="file-pill__meta" x-text="$store.upload.fileMeta()"></div>
                                </div>
                                <button class="icon-btn" @click="$store.upload.clear()" :aria-label="$t('remove')" x-show="!$store.upload.busy"><svg><use href="#i-x"/></svg></button>
                            </div>
                        </template>

                        <template x-if="$store.upload.error"><div class="form-msg form-msg--error" role="alert" x-text="$store.upload.error"></div></template>
                        <template x-if="$store.upload.warning && !$store.upload.error"><div class="form-msg form-msg--warn" x-text="$store.upload.warning"></div></template>

                        <div class="field">
                            <div class="field__label" x-text="$t('recordingLanguage')"></div>
                            <div class="seg seg--block" role="group">
                                <button class="seg__btn" :class="{ 'is-on': $store.upload.recordingLang === 'he' }" @click="$store.upload.recordingLang = 'he'" x-text="$t('hebrew')"></button>
                                <button class="seg__btn" :class="{ 'is-on': $store.upload.recordingLang === 'en' }" @click="$store.upload.recordingLang = 'en'" x-text="$t('english')"></button>
                            </div>
                        </div>

                        <!-- Inline progress while busy -->
                        <template x-if="$store.upload.busy">
                            <div>
                                <div class="small muted" style="display:flex; justify-content:space-between; gap:8px">
                                    <span x-text="$store.upload.phaseLabel()"></span>
                                    <span class="num" x-text="$store.upload.percentLabel()"></span>
                                </div>
                                <div class="progress__bar" style="margin-bottom:10px">
                                    <div class="progress__fill" :class="{ 'is-indeterminate': $store.upload.indeterminate() }" :style="'width:' + $store.upload.percent() + '%'"></div>
                                </div>
                                <button class="btn btn--secondary btn--block" @click="$store.upload.cancel()" x-text="$t('cancel')"></button>
                            </div>
                        </template>
                        <template x-if="!$store.upload.busy">
                            <button class="btn btn--primary btn--block" :disabled="!$store.upload.file || !!$store.upload.error" @click="$store.upload.start()">
                                <svg><use href="#i-ear"/></svg>
                                <span x-text="$t('analyze')"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </section>

            <section class="sidebar__recent">
                <div class="section-title">
                    <span x-text="$t('recent')"></span>
                    <button class="icon-btn" @click="$store.history.load()" :aria-label="$t('refresh')" :title="$t('refresh')"><svg><use href="#i-refresh"/></svg></button>
                </div>
                <div class="card list">
                    <template x-if="!$store.history.items.length">
                        <div class="list__empty" x-text="$store.history.loading ? '…' : $t('noRecent')"></div>
                    </template>
                    <template x-for="item in $store.history.items" :key="item.filename">
                        <button class="list__row list__row--btn" :class="{ 'is-on': $store.analysis.reportFilename === item.filename }" @click="$store.analysis.openReport(item.filename)">
                            <span class="sev-dot" :class="'sev-dot--' + $store.analysis.riskClass(item.summary && item.summary.risk_level)"></span>
                            <span class="list__main">
                                <span class="list__title" x-text="$store.analysis.displayName(item.original_file)" dir="auto"></span>
                                <span class="list__sub" x-text="$store.ui.fmtDate(item.date)"></span>
                            </span>
                            <span class="chip" x-text="(item.summary && item.summary.total_incidents) || 0"></span>
                        </button>
                    </template>
                </div>
            </section>
        </aside>

        <!-- ===== Main ===== -->
        <main id="main" class="main">
            <div class="main__inner">

                <!-- Empty state -->
                <template x-if="!$store.analysis.view && !$store.upload.busy && !$store.upload.failed && !$store.analysis.loading">
                    <section class="empty">
                        <div>
                            <h1 class="empty__title" x-text="$t('emptyTitle')"></h1>
                            <p class="empty__lead" style="margin-top:10px" x-text="$t('emptyLead')"></p>
                        </div>
                        <div class="dropzone dropzone--hero"
                             :class="{ 'is-over': $store.upload.isOver, 'is-reject': !!$store.upload.error }"
                             role="button" tabindex="0"
                             @click="$refs.heroInput.click()"
                             @keydown.enter.prevent="$refs.heroInput.click()"
                             @dragover.prevent="$store.upload.isOver = true"
                             @dragleave.prevent="$store.upload.isOver = false"
                             @drop.prevent="$store.upload.drop($event)">
                            <input type="file" x-ref="heroInput" class="sr-only" tabindex="-1" accept=".wav,.mp3,.m4a,.flac,.aac,.ogg,audio/*"
                                   @change="$store.upload.pick($event.target.files[0]); $event.target.value = ''">
                            <div class="dropzone__icon"><svg><use href="#i-upload"/></svg></div>
                            <div class="dropzone__title" x-text="$store.upload.file ? $store.upload.file.name : $t('dropTitle')" dir="auto"></div>
                            <div class="dropzone__sub" x-text="$store.upload.file ? $store.upload.fileMeta() : $t('dropSub')"></div>
                        </div>
                        <template x-if="$store.upload.error"><div class="form-msg form-msg--error" role="alert" x-text="$store.upload.error"></div></template>
                        <div class="empty__row">
                            <div class="seg" role="group" :aria-label="$t('recordingLanguage')">
                                <button class="seg__btn" :class="{ 'is-on': $store.upload.recordingLang === 'he' }" @click="$store.upload.recordingLang = 'he'" x-text="$t('hebrew')"></button>
                                <button class="seg__btn" :class="{ 'is-on': $store.upload.recordingLang === 'en' }" @click="$store.upload.recordingLang = 'en'" x-text="$t('english')"></button>
                            </div>
                            <button class="btn btn--primary btn--lg" :disabled="!$store.upload.file || !!$store.upload.error" @click="$store.upload.start()">
                                <svg><use href="#i-ear"/></svg><span x-text="$t('analyze')"></span>
                            </button>
                        </div>
                        <div class="empty__hint">
                            <div class="hint"><svg><use href="#i-lock"/></svg><div><b x-text="$t('hint1t')"></b><span x-text="$t('hint1')"></span></div></div>
                            <div class="hint"><svg><use href="#i-globe"/></svg><div><b x-text="$t('hint2t')"></b><span x-text="$t('hint2')"></span></div></div>
                            <div class="hint"><svg><use href="#i-ear"/></svg><div><b x-text="$t('hint3t')"></b><span x-text="$t('hint3')"></span></div></div>
                        </div>
                    </section>
                </template>

                <!-- Progress (only when nothing else is on screen) -->
                <template x-if="$store.upload.busy && !$store.analysis.view">
                    <section class="card progress">
                        <div class="card__bd">
                            <div class="progress__file">
                                <div class="file-pill__icon"><svg><use href="#i-wave"/></svg></div>
                                <div style="min-width:0">
                                    <div class="file-pill__name" style="font-size:16px" x-text="$store.upload.file && $store.upload.file.name" dir="auto"></div>
                                    <div class="file-pill__meta" x-text="$store.upload.phaseLabel()"></div>
                                </div>
                            </div>
                            <div class="progress__bar"><div class="progress__fill" :class="{ 'is-indeterminate': $store.upload.indeterminate() }" :style="'width:' + $store.upload.percent() + '%'"></div></div>
                            <div class="steps">
                                <template x-for="n in 7" :key="n">
                                    <div class="step" :class="{ 'is-done': $store.upload.step > n, 'is-active': $store.upload.step === n && $store.upload.phase === 'analyzing' }">
                                        <span class="step__mark"><svg x-show="$store.upload.step > n"><use href="#i-check"/></svg><span x-show="$store.upload.step <= n && !($store.upload.step === n && $store.upload.phase === 'analyzing')" x-text="n"></span></span>
                                        <span x-text="$t('step' + n)"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="card__ft" style="justify-content:flex-end">
                            <button class="btn btn--secondary" @click="$store.upload.cancel()" x-text="$t('cancel')"></button>
                        </div>
                    </section>
                </template>

                <!-- Failure -->
                <template x-if="$store.upload.failed && !$store.analysis.view">
                    <section class="card progress">
                        <div class="card__bd" style="display:flex; gap:14px; align-items:flex-start">
                            <div class="finding__type" style="color:var(--danger); background:var(--danger-soft)"><svg><use href="#i-alert"/></svg></div>
                            <div style="flex:1">
                                <div style="font-weight:600" x-text="$t('analysisFailed')"></div>
                                <div class="muted small" style="margin-top:4px" x-text="$store.upload.failure" dir="auto"></div>
                            </div>
                        </div>
                        <div class="card__ft" style="justify-content:flex-end">
                            <button class="btn btn--secondary" @click="$store.upload.reset()" x-text="$t('dismiss')"></button>
                            <button class="btn btn--primary" @click="$store.upload.start()" :disabled="!$store.upload.file" x-text="$t('tryAgain')"></button>
                        </div>
                    </section>
                </template>

                <!-- Loading a past report -->
                <template x-if="$store.analysis.loading && !$store.analysis.view">
                    <section class="card progress"><div class="card__bd muted" x-text="$t('loadingReport') + '…'"></div></section>
                </template>

                <!-- ===== Results ===== -->
                <template x-if="$store.analysis.view">
                    <div style="display:flex; flex-direction:column; gap:20px" x-data="{ v: $store.analysis.view }" x-effect="v = $store.analysis.view">

                        <section class="result-hd">
                            <div style="min-width:0">
                                <h1 class="result-hd__title" x-text="v.name" dir="auto"></h1>
                                <div class="result-hd__meta">
                                    <span class="num" x-text="$store.ui.fmtDuration(v.duration)"></span>
                                    <span class="sep"></span>
                                    <span x-text="v.language === 'he' ? $t('hebrew') : (v.language === 'en' ? $t('english') : '')" x-show="v.language"></span>
                                    <span class="sep" x-show="v.language"></span>
                                    <span x-text="$t('analyzedOn') + ' ' + $store.ui.fmtDate(v.analyzedAt)"></span>
                                    <template x-if="v.models.length">
                                        <span style="display:inline-flex; gap:4px; flex-wrap:wrap">
                                            <span class="sep"></span>
                                            <template x-for="m in v.models" :key="m"><span class="chip" x-text="m"></span></template>
                                        </span>
                                    </template>
                                </div>
                            </div>
                            <template x-if="$store.analysis.reportFilename">
                                <div class="result-hd__actions">
                                    <a class="btn btn--secondary btn--sm" download target="_blank" rel="noopener" :href="'/download/' + $store.analysis.reportFilename"><svg><use href="#i-download"/></svg>JSON</a>
                                    <a class="btn btn--secondary btn--sm" download target="_blank" rel="noopener" :href="'/download/' + $store.analysis.reportFilename.replace('.json', '.html')"><svg><use href="#i-download"/></svg>HTML</a>
                                    <a class="btn btn--secondary btn--sm" download target="_blank" rel="noopener" :href="'/download/' + $store.analysis.reportFilename.replace('.json', '.csv')"><svg><use href="#i-download"/></svg>CSV</a>
                                </div>
                            </template>
                        </section>

                        <!-- Verdict -->
                        <section class="card verdict" aria-live="polite">
                            <div class="verdict__main">
                                <div class="verdict__level">
                                    <span class="sev-dot" :class="'sev-dot--' + v.riskClass"></span>
                                    <span x-text="$t('risk_' + v.riskClass)"></span>
                                </div>
                                <p class="verdict__text" x-text="$store.analysis.verdictLine(v)"></p>
                                <div class="meter" :title="$t('scoreLabel') + ': ' + v.score">
                                    <div class="meter__track">
                                        <div class="meter__tick" style="inset-inline-start:12.5%"></div>
                                        <div class="meter__tick" style="inset-inline-start:37.5%"></div>
                                        <div class="meter__tick" style="inset-inline-start:75%"></div>
                                        <div class="meter__fill" :class="'meter__fill--' + v.riskClass" :style="'width:' + v.scorePct + '%'"></div>
                                    </div>
                                    <div class="meter__labels">
                                        <span x-text="$t('zoneNormal')"></span><span x-text="$t('zoneModerate')"></span><span x-text="$t('zoneConcerning')"></span><span x-text="$t('zoneCritical')"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="verdict__side">
                                <div class="stat"><div class="stat__value" x-text="v.incidents.length"></div><div class="stat__label" x-text="$t('moments')"></div></div>
                                <div class="stat" :class="{ 'stat--critical': v.summary.critical_incidents > 0 }"><div class="stat__value" x-text="v.summary.critical_incidents || 0"></div><div class="stat__label" x-text="$t('criticalCount')"></div></div>
                                <div class="stat"><div class="stat__value num" x-text="$store.ui.fmtClock(v.duration)"></div><div class="stat__label" x-text="$t('duration')"></div></div>
                            </div>
                        </section>

                        <!-- Recording strip -->
                        <section class="card strip">
                            <div class="card__hd">
                                <div class="card__title"><svg><use href="#i-wave"/></svg><span x-text="$t('recording')"></span></div>
                                <div class="strip__legend">
                                    <span><i style="background:var(--sev-low)"></i><span x-text="$t('sev_low')"></span></span>
                                    <span><i style="background:var(--sev-medium)"></i><span x-text="$t('sev_medium')"></span></span>
                                    <span><i style="background:var(--sev-high)"></i><span x-text="$t('sev_high')"></span></span>
                                    <span><i style="background:var(--sev-critical)"></i><span x-text="$t('sev_critical')"></span></span>
                                </div>
                            </div>
                            <div class="strip__body">
                                <div class="strip__wave" :class="{ 'is-loading': !$store.player.ready && !$store.player.error }">
                                    <div id="wave" x-init="$store.player.mount($el, v)"></div>
                                    <div class="strip__marks">
                                        <template x-for="(inc, i) in v.incidents" :key="i">
                                            <button class="mark" :class="['mark--' + inc.sev, { 'is-active': $store.player.activeIdx === i }]"
                                                    :style="'left:' + inc.leftPct + '%; width:' + inc.widthPct + '%'"
                                                    :title="$store.analysis.incidentTitle(inc) + ' · ' + $store.ui.fmtRange(inc.start, inc.end)"
                                                    :aria-label="$store.analysis.incidentTitle(inc) + ' ' + $store.ui.fmtRange(inc.start, inc.end)"
                                                    @click="$store.player.playIncident(i)"></button>
                                        </template>
                                    </div>
                                    <div class="strip__empty" x-show="$store.player.error" x-text="$t('audioMissing')"></div>
                                </div>
                                <div class="strip__axis">
                                    <span>0:00</span>
                                    <span x-text="$store.ui.fmtClock(v.duration / 2)"></span>
                                    <span x-text="$store.ui.fmtClock(v.duration)"></span>
                                </div>
                            </div>
                            <div class="strip__ctl">
                                <button class="btn btn--secondary btn--round" @click="$store.player.prev()" :disabled="!$store.player.ready || !v.incidents.length" :aria-label="$t('prevMoment')" :title="$t('prevMoment')"><svg><use href="#i-prev"/></svg></button>
                                <button class="btn btn--primary btn--round btn--lg" @click="$store.player.toggle()" :disabled="!$store.player.ready" :aria-label="$store.player.playing ? $t('pause') : $t('play')">
                                    <svg x-show="!$store.player.playing"><use href="#i-play"/></svg>
                                    <svg x-show="$store.player.playing" x-cloak><use href="#i-pause"/></svg>
                                </button>
                                <button class="btn btn--secondary btn--round" @click="$store.player.next()" :disabled="!$store.player.ready || !v.incidents.length" :aria-label="$t('nextMoment')" :title="$t('nextMoment')"><svg><use href="#i-next"/></svg></button>
                                <span class="strip__time" x-text="$store.ui.fmtClock($store.player.time) + ' / ' + $store.ui.fmtClock($store.player.duration || v.duration)"></span>
                                <span class="small muted" x-show="$store.player.activeIdx !== null" x-text="$store.player.activeIdx !== null ? $store.analysis.incidentTitle(v.incidents[$store.player.activeIdx]) : ''"></span>
                            </div>
                        </section>

                        <!-- Findings -->
                        <section class="card">
                            <div class="card__hd">
                                <div class="card__title"><svg><use href="#i-alert"/></svg><span x-text="$t('findings')"></span><span class="chip" x-text="v.incidents.length"></span></div>
                            </div>
                            <template x-if="!v.incidents.length">
                                <div class="list__empty" style="padding:28px" x-text="$t('noFindings')"></div>
                            </template>
                            <div class="list">
                                <template x-for="(inc, i) in v.incidents" :key="'f' + i">
                                    <div class="finding" :class="{ 'is-active': $store.player.activeIdx === i }" :id="'finding-' + i">
                                        <div class="finding__lead">
                                            <span class="sev-dot" :class="'sev-dot--' + inc.sev"></span>
                                            <span class="finding__type"><svg><use :href="'#' + $store.analysis.typeIcon(inc.type)"/></svg></span>
                                        </div>
                                        <div style="min-width:0">
                                            <div class="finding__title">
                                                <span x-text="$store.analysis.incidentTitle(inc)"></span>
                                                <span class="finding__time" x-text="$store.ui.fmtRange(inc.start, inc.end)"></span>
                                            </div>
                                            <div class="finding__desc" x-show="$store.analysis.showDesc(inc)"><span class="bidi" dir="auto" x-text="inc.description"></span></div>
                                            <div class="finding__meta">
                                                <span class="chip" x-text="$t('type_' + inc.type)"></span>
                                                <span class="chip" x-text="$t('sev_' + inc.sev)"></span>
                                                <span class="chip" x-show="inc.confidence != null" x-text="Math.round(inc.confidence * 100) + '% ' + $t('confidence')"></span>
                                                <span class="chip chip--tint" x-show="inc.mlBacked === true"><svg><use href="#i-spark"/></svg><span x-text="$t('mlTag')"></span></span>
                                            </div>
                                        </div>
                                        <div class="finding__actions">
                                            <a class="btn btn--ghost btn--sm" x-show="inc.clipUrl" :href="inc.clipUrl" download :title="$t('saveClip')">
                                                <svg><use href="#i-download"/></svg><span x-text="$t('saveClip')"></span>
                                            </a>
                                            <button class="btn btn--ghost btn--sm" @click="$store.player.playIncident(i)" :disabled="!$store.player.ready">
                                                <svg><use href="#i-play"/></svg><span x-text="$t('listen')"></span>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </section>

                        <div class="cols-2">
                            <!-- Transcript -->
                            <section class="card">
                                <div class="card__hd">
                                    <div class="card__title"><svg><use href="#i-bubble"/></svg><span x-text="$t('transcript')"></span></div>
                                    <span class="small faint" x-show="v.transcript.model" x-text="v.transcript.model"></span>
                                </div>
                                <template x-if="!v.transcript.segments.length">
                                    <div class="transcript__empty" x-text="v.transcript.error ? $t('transcriptFailed') : $t('transcriptEmpty')" :title="v.transcript.error || ''"></div>
                                </template>
                                <div class="transcript" x-show="v.transcript.segments.length">
                                    <template x-for="(seg, i) in v.transcript.segments" :key="'s' + i">
                                        <div class="tseg" :class="{ 'is-flag': seg.flagged, 'is-now': $store.player.time >= seg.start && $store.player.time < seg.end }" @click="$store.player.seekPlay(seg.start)" role="button" tabindex="0" @keydown.enter="$store.player.seekPlay(seg.start)">
                                            <span class="tseg__time" x-text="$store.ui.fmtClock(seg.start)"></span>
                                            <span class="tseg__text"><span x-text="seg.text"></span><span class="tseg__flag" x-show="seg.flagged" x-text="$t('flagged')"></span></span>
                                        </div>
                                    </template>
                                </div>
                            </section>

                            <!-- Voice signals -->
                            <section class="card">
                                <div class="card__hd"><div class="card__title"><svg><use href="#i-voice"/></svg><span x-text="$t('signals')"></span></div></div>
                                <div class="card__bd" style="display:flex; flex-direction:column; gap:18px">
                                    <template x-if="v.emotion">
                                        <div class="bars">
                                            <template x-for="key in ['arousal','dominance','valence','anger','calm','stress']" :key="key">
                                                <div class="bar" x-show="v.emotion[key] != null">
                                                    <span class="bar__label" x-text="$t('emo_' + key)"></span>
                                                    <span class="bar__track"><span class="bar__fill" :style="'width:' + Math.round((v.emotion[key] || 0) * 100) + '%'"></span></span>
                                                    <span class="bar__value" x-text="Math.round((v.emotion[key] || 0) * 100) + '%'"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="!v.emotion"><div class="muted small" x-text="$t('noSignals')"></div></template>
                                    <template x-if="v.speakers">
                                        <dl class="kv">
                                            <dt x-text="$t('speakers')"></dt><dd x-text="v.speakers.count"></dd>
                                            <dt x-text="$t('adultSpeech')"></dt><dd x-text="$store.ui.fmtClock(v.speakers.adultTime)"></dd>
                                            <dt x-text="$t('childSpeech')"></dt><dd x-text="$store.ui.fmtClock(v.speakers.childTime)"></dd>
                                        </dl>
                                    </template>
                                </div>
                            </section>
                        </div>

                        <div class="cols-2" x-show="v.keyFindings.length || v.recommendations.length">
                            <section class="card" x-show="v.keyFindings.length">
                                <div class="card__hd"><div class="card__title"><svg><use href="#i-info"/></svg><span x-text="$t('keyFindings')"></span></div></div>
                                <div class="card__bd"><ul class="bullets"><template x-for="(k, i) in v.keyFindings" :key="'k' + i"><li><svg><use href="#i-info"/></svg><span class="bidi" dir="auto" x-text="k"></span></li></template></ul></div>
                            </section>
                            <section class="card" x-show="v.recommendations.length">
                                <div class="card__hd"><div class="card__title"><svg><use href="#i-check"/></svg><span x-text="$t('recommendations')"></span></div></div>
                                <div class="card__bd"><ul class="bullets"><template x-for="(r, i) in v.recommendations" :key="'r' + i"><li><svg><use href="#i-check"/></svg><span class="bidi" dir="auto" x-text="r"></span></li></template></ul></div>
                            </section>
                        </div>

                    </div>
                </template>

            </div>
        </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" aria-live="polite">
        <template x-for="t in $store.toasts.items" :key="t.id">
            <div class="toast" :class="'toast--' + t.type"
                 x-transition:enter="fade-enter" x-transition:enter-start="fade-enter-start" x-transition:enter-end="fade-enter-end"
                 x-transition:leave="fade-leave" x-transition:leave-start="fade-leave-start" x-transition:leave-end="fade-leave-end">
                <svg x-show="t.type === 'success'"><use href="#i-check"/></svg>
                <svg x-show="t.type === 'error'"><use href="#i-alert"/></svg>
                <svg x-show="t.type === 'info'"><use href="#i-info"/></svg>
                <span x-text="t.message"></span>
            </div>
        </template>
    </div>

</body>
</html>
